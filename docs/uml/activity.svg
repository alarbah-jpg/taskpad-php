<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="744px" preserveAspectRatio="none" style="width:714px;height:744px;background:#FFFFFF;" version="1.1" viewBox="0 0 714 744" width="714px" zoomAndPan="magnify"><title>TaskPad PHP - Activity Diagram: Create a task (Post/Redirect/Get)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="523.8379" x="93.9648" y="32.9951">TaskPad PHP - Activity Diagram: Create a task (Post/Redirect/Get)</text><ellipse cx="192.791" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.5781" x="96.002" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.5781" x="106.002" y="108.4355">User opens create.php (GET)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.8691" x="54.3564" y="141.2656"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.8691" x="64.3564" y="162.4043">Server shows empty form with CSRF token</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.9395" x="93.3213" y="239.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.9395" x="103.3213" y="260.373">User submits the form (POST)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="363.582" x="11" y="308.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="215.0039" x="21" y="329.3418">Server validates and sanitizes input</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="343.582" x="21" y="343.3105">(title, priority whitelist, due date) and checks CSRF token</text><polygon fill="#F1F1F1" points="192.791,195.2344,204.791,207.2344,192.791,219.2344,180.791,207.2344,192.791,195.2344" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="160.7095,376.1406,224.8726,376.1406,236.8726,388.1406,224.8726,400.1406,160.7095,400.1406,148.7095,388.1406,160.7095,376.1406" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="64.1631" x="160.7095" y="391.9487">Input valid?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="236.8726" y="385.5464">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="319.1855" x="384.582" y="273.7188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.7051" x="394.582" y="294.8574">Server re-renders the form with</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="299.1855" x="394.582" y="308.8262">error messages and the user's entries (HTTP 422)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="330.6816" x="27.4502" y="441.5396"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="310.6816" x="37.4502" y="462.6782">TaskRepository appends the task to data/tasks.json</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="237.7344" x="73.9238" y="495.5083"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.7344" x="83.9238" y="516.647">Flash message stored in the session</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="266.4922" x="59.5449" y="549.4771"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.4922" x="69.5449" y="570.6157">Server redirects to index.php (HTTP 303)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="207.1719" x="89.2051" y="603.4458"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.1719" x="99.2051" y="624.5845">Browser requests the list (GET)</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="337.2676" x="24.1572" y="657.4146"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="317.2676" x="34.1572" y="678.5532">List page shows the new task and the flash message</text><ellipse cx="192.791" cy="722.3833" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="192.791" cy="722.3833" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="192.791" x2="192.791" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="188.791,77.2969,192.791,87.2969,196.791,77.2969,192.791,81.2969" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="192.791" x2="192.791" y1="121.2656" y2="141.2656"/><polygon fill="#181818" points="188.791,131.2656,192.791,141.2656,196.791,131.2656,192.791,135.2656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="192.791" x2="192.791" y1="273.2031" y2="308.2031"/><polygon fill="#181818" points="188.791,298.2031,192.791,308.2031,196.791,298.2031,192.791,302.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="192.791" x2="192.791" y1="219.2344" y2="239.2344"/><polygon fill="#181818" points="188.791,229.2344,192.791,239.2344,196.791,229.2